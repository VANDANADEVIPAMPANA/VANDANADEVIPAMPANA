<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="pet-t">
  <title id="pet-t">Online Event Ticketing System: Modern web interface for seamless ticket booking.</title>
  <defs>
    <linearGradient id="pet-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="pet-glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
    <pattern id="pet-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".08"/></pattern>
    <clipPath id="pet-clip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .pet-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .pet-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .pet-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#pet-clip)">
    <rect width="1200" height="320" fill="url(#pet-bg)"/>
    <rect x="750" width="450" height="320" fill="url(#pet-grid)"/>
    <rect width="1200" height="320" fill="url(#pet-glow)"/>

    <g transform="translate(56, 0)">
      <text class="pet-mono" x="0" y="55" font-size="12" letter-spacing="2.6" fill="#C77B9B">02 · WEB DEVELOPMENT · JAVASCRIPT &amp; UI</text>
      <text class="pet-serif" x="0" y="112" font-size="44" font-weight="300" letter-spacing="-1" fill="#F8F0F3">Online Event Ticketing System</text>
      <text class="pet-sans" x="0" y="152" font-size="16" fill="#B6A3AC">Streamlining event discovery, seat reservation, and checkout experiences.</text>
      <text class="pet-mono" x="0" y="186" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT ›</tspan> Interactive ticketing dashboard, responsive layout &amp; booking workflow</text>

      <g transform="translate(0, 218)">
        <g transform="translate(0, 0)">
          <rect width="180" height="65" rx="10" fill="#14090F" stroke="#701A3D" stroke-width="1"/>
          <text class="pet-serif" x="18" y="38" font-size="22" font-weight="400" fill="#F8F0F3">Interactive</text>
          <text class="pet-mono" x="18" y="54" font-size="9.5" letter-spacing="1.5" fill="#C77B9B">SEAT SELECTION</text>
        </g>
        <g transform="translate(195, 0)">
          <rect width="180" height="65" rx="10" fill="#14090F" stroke="#701A3D" stroke-width="1"/>
          <text class="pet-serif" x="18" y="38" font-size="22" font-weight="400" fill="#F8F0F3">Vanilla JS</text>
          <text class="pet-mono" x="18" y="54" font-size="9.5" letter-spacing="1.5" fill="#C77B9B">CLEAN LOGIC</text>
        </g>
        <g transform="translate(390, 0)">
          <rect width="180" height="65" rx="10" fill="#14090F" stroke="#701A3D" stroke-width="1"/>
          <text class="pet-serif" x="18" y="38" font-size="22" font-weight="400" fill="#F8F0F3">Responsive</text>
          <text class="pet-mono" x="18" y="54" font-size="9.5" letter-spacing="1.5" fill="#C77B9B">CROSS-DEVICE</text>
        </g>
      </g>
    </g>

    <!-- Right Side Ticket Badge Graphic -->
    <g transform="translate(830, 65)">
      <rect width="290" height="190" rx="14" fill="#14090F" stroke="#C77B9B" stroke-opacity=".3" stroke-width="1"/>
      <line x1="200" y1="0" x2="200" y2="190" stroke="#701A3D" stroke-width="1.5" stroke-dasharray="4 4"/>
      <circle cx="200" cy="0" r="10" fill="#10070C"/>
      <circle cx="200" cy="190" r="10" fill="#10070C"/>
      
      <text class="pet-serif" x="25" y="65" font-size="24" fill="#F8F0F3">EVENT TICKET</text>
      <text class="pet-mono" x="25" y="95" font-size="11" letter-spacing="1.5" fill="#C77B9B">PASS: VIP ACCESS</text>
      <text class="pet-sans" x="25" y="130" font-size="12" fill="#B6A3AC">Vandana Devi Pampana</text>
      
      <text class="pet-mono" x="245" y="105" text-anchor="middle" font-size="14" fill="#E5B5C7" transform="rotate(90 245 105)">#2026</text>
    </g>

    <rect x=".5" y=".5" width="1199" height="319" rx="17.5" fill="none" stroke="#701A3D" stroke-opacity=".4"/>
  </g>
</svg>
