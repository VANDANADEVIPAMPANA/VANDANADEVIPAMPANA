<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="pis-t">
  <title id="pis-t">Inventory and Sales Management System</title>
  <defs>
    <linearGradient id="pis-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="pis-glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
    <pattern id="pis-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".08"/></pattern>
    <clipPath id="pis-clip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .pis-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .pis-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .pis-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#pis-clip)">
    <rect width="1200" height="320" fill="url(#pis-bg)"/>
    <rect x="750" width="450" height="320" fill="url(#pis-grid)"/>
    <rect width="1200" height="320" fill="url(#pis-glow)"/>

    <g transform="translate(56, 0)">
      <text class="pis-mono" x="0" y="55" font-size="12" letter-spacing="2.6" fill="#C77B9B">03 · CORE SOFTWARE · JAVA &amp; DBMS</text>
      <text class="pis-serif" x="0" y="112" font-size="44" font-weight="300" letter-spacing="-1" fill="#F8F0F3">Inventory &amp; Sales Management</text>
      <text class="pis-sans" x="0" y="152" font-size="16" fill="#B6A3AC">Structured stock control, invoice tracking, and point-of-sale data architecture.</text>
      <text class="pis-mono" x="0" y="186" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT ›</tspan> Relational schema, transactional integrity, stock alerts &amp; order logs</text>

      <g transform="translate(0, 218)">
        <g transform="translate(0, 0)">
          <rect width="180" height="65" rx="10" fill="#14090F" stroke="#701A3D" stroke-width="1"/>
          <text class="pis-serif" x="18" y="38" font-size="22" font-weight="400" fill="#F8F0F3">Java</text>
          <text class="pis-mono" x="18" y="54" font-size="9.5" letter-spacing="1.5" fill="#C77B9B">OOP BACKBONE</text>
        </g>
        <g transform="translate(195, 0)">
          <rect width="180" height="65" rx="10" fill="#14090F" stroke="#701A3D" stroke-width="1"/>
          <text class="pis-serif" x="18" y="38" font-size="22" font-weight="400" fill="#F8F0F3">DBMS</text>
          <text class="pis-mono" x="18" y="54" font-size="9.5" letter-spacing="1.5" fill="#C77B9B">ACID INTEGRITY</text>
        </g>
        <g transform="translate(390, 0)">
          <rect width="180" height="65" rx="10" fill="#14090F" stroke="#701A3D" stroke-width="1"/>
          <text class="pis-serif" x="18" y="38" font-size="22" font-weight="400" fill="#F8F0F3">Automation</text>
          <text class="pis-mono" x="18" y="54" font-size="9.5" letter-spacing="1.5" fill="#C77B9B">STOCK NOTIFICATIONS</text>
        </g>
      </g>
    </g>

    <!-- Right Graphic: Database Grid -->
    <g transform="translate(830, 65)">
      <rect width="290" height="190" rx="14" fill="#14090F" stroke="#C77B9B" stroke-opacity=".3" stroke-width="1"/>
      <rect x="20" y="20" width="250" height="30" rx="6" fill="#190B12" stroke="#701A3D"/>
      <text class="pis-mono" x="35" y="40" font-size="10.5" fill="#E5B5C7">schema: inventory_records</text>
      
      <rect x="20" y="60" width="250" height="26" rx="4" fill="#10070C"/>
      <text class="pis-mono" x="35" y="77" font-size="10" fill="#B6A3AC">id: UUID PRIMARY KEY</text>
      
      <rect x="20" y="92" width="250" height="26" rx="4" fill="#10070C"/>
      <text class="pis-mono" x="35" y="109" font-size="10" fill="#B6A3AC">stock_qty: INTEGER</text>
      
      <rect x="20" y="124" width="250" height="26" rx="4" fill="#10070C"/>
      <text class="pis-mono" x="35" y="141" font-size="10" fill="#B6A3AC">status: IN_STOCK (99.8%)</text>
    </g>

    <rect x=".5" y=".5" width="1199" height="319" rx="17.5" fill="none" stroke="#701A3D" stroke-opacity=".4"/>
  </g>
</svg>
