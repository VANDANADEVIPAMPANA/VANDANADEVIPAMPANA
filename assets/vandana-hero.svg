<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Pampana Vandana Devi — Engineering intelligence. Designing experiences.</title>
  <desc id="hero-desc">AI/ML Engineer, Full-Stack Developer and Problem Solver. B.Tech in Artificial Intelligence and Machine Learning, Aditya University.</desc>

  <defs>
    <radialGradient id="hero-bg" cx="72%" cy="38%" r="80%">
      <stop offset="0" stop-color="#2A0E1B"/>
      <stop offset=".55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#10070C"/>
    </radialGradient>
    <radialGradient id="hero-light-a" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".75"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-light-b" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C77B9B" stop-opacity=".32"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-name-grad" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="680" y2="0">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset=".55" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B"/>
    </linearGradient>
    <linearGradient id="hero-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="-40" y2="0">
      <stop offset="0" stop-color="#F8F0F3" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1100 0;1100 0" keyTimes="0;.35;1" dur="8s" begin="2s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="hero-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset=".2" stop-color="#E5B5C7"/>
      <stop offset=".75" stop-color="#701A3D"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#701A3D" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
    <filter id="hero-blur"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>

  <style>
    .vh-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .vh-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .vh-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .vh-fade { animation: vh-fade 1.2s cubic-bezier(.16,1,.3,1) both; }
    .vh-d1 { animation-delay: .15s; } .vh-d2 { animation-delay: .3s; }
    .vh-d3 { animation-delay: .45s; } .vh-d4 { animation-delay: .6s; }
    @keyframes vh-fade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes orbit-cw { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes orbit-ccw { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    .vh-orbit1 { transform-origin: 940px 240px; animation: orbit-cw 38s linear infinite; }
    .vh-orbit2 { transform-origin: 940px 240px; animation: orbit-ccw 26s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .vh-fade { animation: none; }
      .vh-orbit1, .vh-orbit2 { animation: none; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="480" rx="20" fill="url(#hero-bg)"/>
  <rect width="1200" height="480" rx="20" fill="url(#hero-grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="940" cy="240" r="180" fill="url(#hero-light-a)" filter="url(#hero-blur)"/>
  <circle cx="940" cy="240" r="100" fill="url(#hero-light-b)" filter="url(#hero-blur)"/>

  <!-- Orbital Geometry Graphic on Right -->
  <g opacity="0.65">
    <circle cx="940" cy="240" r="170" fill="none" stroke="#701A3D" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="940" cy="240" r="120" fill="none" stroke="#C77B9B" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="940" cy="240" r="70" fill="none" stroke="#E5B5C7" stroke-width="0.8" stroke-dasharray="2 4"/>
    
    <!-- Central Monogram Sphere -->
    <circle cx="940" cy="240" r="46" fill="#190B12" stroke="#C77B9B" stroke-width="1.5"/>
    <text class="vh-serif" x="940" y="254" text-anchor="middle" font-size="34" font-weight="600" fill="#F8F0F3" letter-spacing="1">VD</text>
    
    <!-- Orbiting nodes -->
    <g class="vh-orbit1">
      <circle cx="1110" cy="240" r="5" fill="#E5B5C7"/>
      <circle cx="1110" cy="240" r="9" fill="none" stroke="#E5B5C7" stroke-width="1" opacity="0.5"/>
    </g>
    <g class="vh-orbit2">
      <circle cx="820" cy="240" r="4" fill="#C77B9B"/>
    </g>
  </g>

  <!-- Left Content Block -->
  <g transform="translate(60, 0)">
    <!-- Status / Role Badge -->
    <g class="vh-fade" transform="translate(0, 72)">
      <rect width="265" height="30" rx="15" fill="#190B12" stroke="#701A3D" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#38EF7D">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text class="vh-mono" x="28" y="19" font-size="10.5" font-weight="600" letter-spacing="2" fill="#E5B5C7">OPEN TO OPPORTUNITIES</text>
    </g>

    <!-- Eyebrow Tag -->
    <g class="vh-fade vh-d1" transform="translate(0, 134)">
      <text class="vh-mono" x="0" y="0" font-size="12" letter-spacing="3.5" fill="#C77B9B">01 // ARTIFICIAL INTELLIGENCE &amp; FULL-STACK</text>
    </g>

    <!-- Full Name Heading -->
    <g class="vh-fade vh-d2" transform="translate(0, 204)">
      <text class="vh-serif" x="0" y="0" font-size="52" font-weight="300" letter-spacing="-0.5" fill="url(#hero-name-grad)">
        Pampana <tspan font-style="italic" fill="url(#hero-sheen)">Vandana Devi</tspan>
      </text>
    </g>

    <!-- Professional Roles Subtitle -->
    <g class="vh-fade vh-d3" transform="translate(0, 252)">
      <text class="vh-sans" x="0" y="0" font-size="20" font-weight="400" fill="#E5B5C7" letter-spacing="0.5">
        AI/ML Engineer · Full-Stack Developer · Problem Solver
      </text>
    </g>

    <!-- Academic Affiliation -->
    <g class="vh-fade vh-d4" transform="translate(0, 290)">
      <text class="vh-mono" x="0" y="0" font-size="13.5" fill="#B6A3AC" letter-spacing="1.2">
        Aditya University · B.Tech in Artificial Intelligence &amp; Machine Learning
      </text>
    </g>

    <!-- Bottom Accent Divider Line -->
    <path d="M 0 350 L 780 350" stroke="url(#hero-rule)" stroke-width="1.2"/>
    <circle cx="0" cy="350" r="5" fill="#F8F0F3" opacity="0">
      <animate attributeName="cx" values="0;780" dur="7s" begin="1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;.2;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Highlights Row -->
    <g transform="translate(0, 395)" class="vh-fade vh-d4">
      <text class="vh-mono" x="0" y="0" font-size="11.5" letter-spacing="2" fill="#C77B9B">LANGUAGES:</text>
      <text class="vh-sans" x="100" y="0" font-size="13" font-weight="500" fill="#F8F0F3">Java · Python · JavaScript · TypeScript</text>
      
      <text class="vh-mono" x="420" y="0" font-size="11.5" letter-spacing="2" fill="#C77B9B">COMPETITIVE:</text>
      <text class="vh-sans" x="535" y="0" font-size="13" font-weight="500" fill="#F8F0F3">LeetCode · CodeChef · HackerRank</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="479" rx="19.5" fill="none" stroke="#701A3D" stroke-opacity="0.4"/>
</svg>
