<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="tc-title tc-desc">
  <title id="tc-title">Tech stack</title>
  <desc id="tc-desc">Languages: Java, Python, C, JavaScript, TypeScript. Frontend: React, Vite, HTML5, CSS3, Tailwind CSS. Backend and DB: Node.js, Supabase, PostgreSQL, MySQL, DBMS. AI and Core: Machine Learning, Data Mining, OS. Tools: Git, GitHub, VS Code.</desc>
  <defs>
    <linearGradient id="tc-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="tc-glow" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#451126" stop-opacity=".75"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .tc-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tc-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tc-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tc-panel { animation: tc-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    @keyframes tc-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .tc-panel { animation: none; } }
  </style>

  <rect width="1200" height="420" rx="20" fill="url(#tc-bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#tc-glow)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="19.5" fill="none" stroke="#701A3D" stroke-opacity=".3"/>

  <!-- Row 1: Languages, Frontend, Backend -->
  <!-- Col 1: Languages -->
  <g class="tc-panel" style="animation-delay:.1s" transform="translate(40, 40)">
    <rect width="350" height="155" rx="14" fill="#14090F" stroke="#701A3D" stroke-width="1"/>
    <rect x="0" y="0" width="3" height="155" rx="1.5" fill="#E5B5C7"/>
    <text class="tc-mono" x="22" y="32" font-size="11" letter-spacing="2" fill="#C77B9B">01 // LANGUAGES</text>
    <text class="tc-serif" x="22" y="68" font-size="24" font-weight="300" fill="#F8F0F3">Java · Python · C</text>
    <text class="tc-sans" x="22" y="98" font-size="14" fill="#E5B5C7">JavaScript · TypeScript · SQL</text>
    <text class="tc-mono" x="22" y="132" font-size="11" fill="#B6A3AC">OOP · DSA · Algorithmic scripts</text>
  </g>

  <!-- Col 2: Frontend & UI -->
  <g class="tc-panel" style="animation-delay:.2s" transform="translate(425, 40)">
    <rect width="350" height="155" rx="14" fill="#14090F" stroke="#701A3D" stroke-width="1"/>
    <rect x="0" y="0" width="3" height="155" rx="1.5" fill="#C77B9B"/>
    <text class="tc-mono" x="22" y="32" font-size="11" letter-spacing="2" fill="#C77B9B">02 // FRONTEND &amp; UI</text>
    <text class="tc-serif" x="22" y="68" font-size="24" font-weight="300" fill="#F8F0F3">React · Vite · HTML5</text>
    <text class="tc-sans" x="22" y="98" font-size="14" fill="#E5B5C7">Tailwind CSS · CSS3 · Responsive UI</text>
    <text class="tc-mono" x="22" y="132" font-size="11" fill="#B6A3AC">Component architecture · SPA</text>
  </g>

  <!-- Col 3: Backend & Database -->
  <g class="tc-panel" style="animation-delay:.3s" transform="translate(810, 40)">
    <rect width="350" height="155" rx="14" fill="#14090F" stroke="#701A3D" stroke-width="1"/>
    <rect x="0" y="0" width="3" height="155" rx="1.5" fill="#701A3D"/>
    <text class="tc-mono" x="22" y="32" font-size="11" letter-spacing="2" fill="#C77B9B">03 // BACKEND &amp; DATA</text>
    <text class="tc-serif" x="22" y="68" font-size="24" font-weight="300" fill="#F8F0F3">Supabase · Node.js</text>
    <text class="tc-sans" x="22" y="98" font-size="14" fill="#E5B5C7">PostgreSQL · MySQL · DBMS</text>
    <text class="tc-mono" x="22" y="132" font-size="11" fill="#B6A3AC">Relational modeling · Edge functions</text>
  </g>

  <!-- Row 2: AI/Core, Dev Tools -->
  <!-- Col 1: AI/ML & Core -->
  <g class="tc-panel" style="animation-delay:.4s" transform="translate(40, 225)">
    <rect width="540" height="155" rx="14" fill="#14090F" stroke="#701A3D" stroke-width="1"/>
    <rect x="0" y="0" width="3" height="155" rx="1.5" fill="#E5B5C7"/>
    <text class="tc-mono" x="22" y="32" font-size="11" letter-spacing="2" fill="#C77B9B">04 // INTELLIGENCE &amp; COMPUTING CORE</text>
    <text class="tc-serif" x="22" y="68" font-size="24" font-weight="300" fill="#F8F0F3">Machine Learning · Data Mining</text>
    <text class="tc-sans" x="22" y="98" font-size="14" fill="#E5B5C7">Operating Systems · NLP · LLM Integration (Gemini AI)</text>
    <text class="tc-mono" x="22" y="132" font-size="11" fill="#B6A3AC">Classification models · Text vectorization</text>
  </g>

  <!-- Col 2: Developer Workflow -->
  <g class="tc-panel" style="animation-delay:.5s" transform="translate(620, 225)">
    <rect width="540" height="155" rx="14" fill="#14090F" stroke="#701A3D" stroke-width="1"/>
    <rect x="0" y="0" width="3" height="155" rx="1.5" fill="#C77B9B"/>
    <text class="tc-mono" x="22" y="32" font-size="11" letter-spacing="2" fill="#C77B9B">05 // WORKFLOW &amp; DEPLOYMENT</text>
    <text class="tc-serif" x="22" y="68" font-size="24" font-weight="300" fill="#F8F0F3">Git · GitHub · VS Code</text>
    <text class="tc-sans" x="22" y="98" font-size="14" fill="#E5B5C7">Vercel · npm · Postman · REST APIs</text>
    <text class="tc-mono" x="22" y="132" font-size="11" fill="#B6A3AC">Version control · CI/CD · Agile workflows</text>
  </g>
</svg>
