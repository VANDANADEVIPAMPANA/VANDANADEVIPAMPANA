<svg fill="none" viewBox="0 0 850 260" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          position: relative;
          width: 850px;
          height: 260px;
          background: #10070C;
          background: radial-gradient(circle at 80% 20%, #451126 0%, #190B12 50%, #10070C 100%);
          border-radius: 14px;
          border: 1px solid #701A3D;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          box-sizing: border-box;
          padding: 40px 50px;
        }
        .grid {
          position: absolute;
          inset: 0;
          background-image: linear-gradient(to right, rgba(199, 123, 155, 0.05) 1px, transparent 1px),
                            linear-gradient(to bottom, rgba(199, 123, 155, 0.05) 1px, transparent 1px);
          background-size: 30px 30px;
        }
        .glow-orb {
          position: absolute;
          width: 320px;
          height: 320px;
          right: -40px;
          top: -80px;
          background: radial-gradient(circle, rgba(199, 123, 155, 0.28) 0%, rgba(112, 26, 61, 0.1) 60%, transparent 80%);
          border-radius: 50%;
          filter: blur(25px);
          animation: floatOrb 8s ease-in-out infinite alternate;
        }
        @keyframes floatOrb {
          0% { transform: scale(1) translate(0, 0); }
          100% { transform: scale(1.15) translate(-30px, 20px); }
        }
        .badge {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 6px 14px;
          background: rgba(112, 26, 61, 0.45);
          border: 1px solid rgba(199, 123, 155, 0.4);
          border-radius: 30px;
          color: #E5B5C7;
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          margin-bottom: 14px;
        }
        .status-dot {
          width: 8px;
          height: 8px;
          background: #38ef7d;
          border-radius: 50%;
          box-shadow: 0 0 8px #38ef7d;
          animation: pulse 2s infinite;
        }
        @keyframes pulse {
          0% { opacity: 0.5; }
          50% { opacity: 1; }
          100% { opacity: 0.5; }
        }
        .title {
          font-size: 34px;
          font-weight: 800;
          color: #F8F0F3;
          margin: 0 0 8px 0;
          letter-spacing: -0.5px;
        }
        .title span {
          background: linear-gradient(90deg, #F8F0F3 20%, #E5B5C7 60%, #C77B9B 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .subtitle {
          font-size: 16px;
          font-weight: 400;
          color: #C77B9B;
          margin: 0;
          letter-spacing: 0.5px;
        }
        .accent-line {
          position: absolute;
          bottom: 0;
          left: 0;
          right: 0;
          height: 3px;
          background: linear-gradient(90deg, #451126, #701A3D, #C77B9B, #E5B5C7, transparent);
        }
      </style>
      <div class="container">
        <div class="grid"></div>
        <div class="glow-orb"></div>
        <div class="badge">
          <span class="status-dot"></span>
          OPEN TO OPPORTUNITIES
        </div>
        <h1 class="title">Hi, I'm <span>Vandana Devi</span> 👋</h1>
        <p class="subtitle">Full-Stack Developer • AI / ML Enthusiast • Creative Problem Solver</p>
        <div class="accent-line"></div>
      </div>
    </div>
  </foreignObject>
</svg>
